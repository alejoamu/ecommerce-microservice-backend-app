# Locust configuration file for E-commerce Microservices Performance Testing

# Host configuration
host = http://127.0.0.1:57638

# User configuration
users = 50
spawn-rate = 5

# Test duration (in seconds)
run-time = 300

# Web UI configuration
web-host = http://127.0.0.1:57638
web-port = 8089

# Logging
logfile = performance-tests/locust.log
loglevel = INFO

# CSV output
csv = performance-tests/results/performance_test

# HTML report
html = performance-tests/results/performance_report.html

# Headless mode (for CI/CD)
headless = false

# Stop timeout
stop-timeout = 30
